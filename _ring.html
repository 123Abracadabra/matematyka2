{% set r = 17 %}
{% set circ = (2 * 3.14159 * r)|round(2) %}
{% set offset = (circ * (1 - ch.pct / 100))|round(2) %}
<svg class="ring" viewBox="0 0 40 40" width="{{ size|default(40) }}" height="{{ size|default(40) }}">
  <circle cx="20" cy="20" r="{{ r }}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/>
  <circle cx="20" cy="20" r="{{ r }}" fill="none" stroke="{{ ch.color }}" stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="{{ circ }}"
    stroke-dashoffset="{{ offset }}"
    transform="rotate(-90 20 20)"
    class="ring__arc"/>
</svg>
